name: Deploy to dev app

on:
  push:
    branches:
      - develop

jobs:
  deploy-web:
    name: Deploy the web application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: develop
      - name: Install clever tools
        run: |
          npm install -g clever-tools

      - name: Deploy to dev application
        env:
          CC_APP_ID: ${{ secrets.CC_APP_DEV_ID }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
        run: |
          clever link $CC_APP_ID --alias mij-develop
          clever deploy --alias mij-develop --force --same-commit-policy restart
