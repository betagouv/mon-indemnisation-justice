; Configuration PHP chargée par FrankenPHP sur CleverCloud https://www.clever.cloud/developers/doc/deploy/applications/frankenphp
date.timezone = "Europe/Paris"
intl.default_locale = "fr"
memory_limit = 512M

; Pièces jointes : 5 Mo par fichier côté frontend, jusqu'à 10 fichiers par envoi
upload_max_filesize = 5M
post_max_size = 60M
max_file_uploads = 20
