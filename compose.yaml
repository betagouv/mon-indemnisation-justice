services:
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-precondev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precontentieux}
      POSTGRES_USER: ${POSTGRES_USER:-precontentieux}
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data:rw
      # Pour relancer ces scripts, vider le dossier de données (`rm -Rf .docker/postgres/data/*`)
      - ./.docker/postgres/scripts/:/docker-entrypoint-initdb.d
      # Accès aux fichiers pour les requêtes nécessitant `pg_stat_file`
      - .docker/php/fichiers:/app/fichiers
    ports:
      - "5432:5432"

  nginx:
    hostname: nginx
    stdin_open: true
    tty: true
    build:
      dockerfile: .docker/nginx/Dockerfile
      context: .
    networks:
      default:
        # Permet aux autres conteneurs de résoudre les domaines
        aliases:
          - mon-indemnisation.justice.gouv.dev
          - mon-indemnisation.justice.gouv.test
    ports:
      - "80:80"
      - "443:443"

  # Mailpit: email SMTP + web UI to see trapped emails
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # RabbitMQ : transport de Symfony Messenger, interface d'administration sur http://localhost:15672
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    # Utilisateur (`precondev` / `precondev`), vhosts (`dev`, `test`), exchanges et files provisionnés au démarrage
    # depuis `.docker/rabbitmq/conf/definitions.json`
    volumes:
      - ./.docker/rabbitmq/data:/var/lib/rabbitmq:rw
      - ./.docker/rabbitmq/conf/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./.docker/rabbitmq/conf/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Symfony app
  symfony:
    hostname: symfony
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: dev
      args:
        - APP_ENV=dev
        - APP_DEBUG=true
    stdin_open: true
    tty: true
    environment:
      - APP_ENV=dev
      - SYMFONY_DEPRECATIONS_HELPER=disabled
      - MAILPIT_URL=http://mailpit:8025
      # Port d'écoute du `Caddyfile` (8080 par défaut, comme sur CleverCloud)
      - CC_FRANKENPHP_PORT=80
      - HTTPS=true;
      - REQUEST_SCHEME=https
      - INSTANCE_NUMBER=0
      - DOSSIER_STOCKAGE_LOCAL=/app/fichiers/dev
      - LEGALYSPACE_BASE_APP_URI=https://esign.ppr.legalyspace.com
      - MESSENGER_TRANSPORT_DSN=amqp://precondev:precondev@rabbitmq:5672/dev/messages
      # Hub Mercure intégré à FrankenPHP, déclaré dans le `Caddyfile` (mode de compatibilité, comme en prod)
      - MERCURE_URL=http://symfony/.well-known/mercure
      - MERCURE_PUBLIC_URL=https://mon-indemnisation.justice.gouv.dev/.well-known/mercure
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
    # Même `Caddyfile` qu'en test et en prod : `php-server --mercure` lance un hub en mode « moderne » (protocole
    # 1.0) qui refuse les JWT au format historique émis par l'application
    command: [ "frankenphp", "run", "--config", "/app/Caddyfile" ]
    restart: always
    depends_on:
      - postgres
      - mailpit
      - rabbitmq
      - vite
      - idconnect
      - nginx
    volumes:
      # Ce partage, via un volume, est requis afin que Symfony puisse lire les manifestes produits par `encore`
      - ./backend:/app
      - ./frontend/public/preview:/app/public/preview
      - .docker/php/fichiers:/app/fichiers
      # Volumes nommés, partagés avec le `worker`
      - symfony_vendor:/app/vendor
      - symfony_node_modules:/app/node_modules
      # Navigateur installé par `demarrage.sh` (`npx puppeteer browsers install`), partagé avec le `worker`
      - puppeteer_cache:/root/.cache/puppeteer
      - /app/var
    ports:
      - "8001:80"
    # Le conteneur n'est sain qu'une fois `demarrage.sh` terminé (dépendances installées, migrations jouées) et le
    # serveur à l'écoute
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null http://localhost/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

  # Consommateur Symfony Messenger : traite les messages asynchrones (ex : évènements de signature électronique)
  worker:
    hostname: worker
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: dev
      args:
        - APP_ENV=dev
        - APP_DEBUG=true
    environment:
      - APP_ENV=dev
      - SYMFONY_DEPRECATIONS_HELPER=disabled
      - MAILPIT_URL=http://mailpit:8025
      - HTTPS=true;
      - REQUEST_SCHEME=https
      - INSTANCE_NUMBER=0
      - DOSSIER_STOCKAGE_LOCAL=/app/fichiers/dev
      - LEGALYSPACE_BASE_APP_URI=https://esign.ppr.legalyspace.com
      - MESSENGER_TRANSPORT_DSN=amqp://precondev:precondev@rabbitmq:5672/dev/messages
      - MERCURE_URL=http://symfony/.well-known/mercure
      - MERCURE_PUBLIC_URL=https://mon-indemnisation.justice.gouv.dev/.well-known/mercure
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
    # Pas de `demarrage.sh` : dépendances et migrations sont gérées par le conteneur `symfony`
    entrypoint: [ ]
    # Redémarre `messenger:consume` à chaque modification du code PHP (cf. le script)
    command: [ "/usr/local/bin/worker-dev.sh" ]
    restart: always
    healthcheck:
      test: [ "NONE" ]
    depends_on:
      symfony:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    volumes:
      - ./backend:/app
      - .docker/php/fichiers:/app/fichiers
      - symfony_vendor:/app/vendor
      - ./.docker/php/worker-dev.sh:/usr/local/bin/worker-dev.sh:ro
      - symfony_node_modules:/app/node_modules
      # Navigateur installé par `demarrage.sh` (`npx puppeteer browsers install`), partagé avec le `worker`
      - puppeteer_cache:/root/.cache/puppeteer
      - /app/var

  test:
    hostname: test
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: test
      args:
        - APP_ENV=test
        - APP_DEBUG=${TEST_DEBUG:-0}
        - APP_SECRET=bafc23a0315b735289c499a886798934
        - DATABASE_URL=postgresql://precontentieux:precontentieux@postgres:5432/precontest?serverVersion=15&charset=utf8
        - BASE_URL=https://mon-indemnisation.justice.gouv.test
        - VITE_TELEPHONE_SERRURIER=${TELEPHONE_SERRURIER:-0123456789}
    depends_on:
      - postgres
      - mailpit
      - rabbitmq
      - idconnect
      - nginx
      - documenso
    environment:
      - SYMFONY_DEPRECATIONS_HELPER=disabled
      - MAILPIT_URL=http://mailpit:8025
      - HTTPS=true;
      - REQUEST_SCHEME=https
      - INSTANCE_NUMBER=0
      - DOSSIER_STOCKAGE_LOCAL=/app/fichiers/test
      - CC_FRANKENPHP_PORT=80
      - APP_HOME=/app
      - MESSENGER_TRANSPORT_DSN=amqp://precondev:precondev@rabbitmq:5672/test/messages
      # Hub Mercure activé par le `Caddyfile`
      - MERCURE_URL=http://localhost/.well-known/mercure
      - MERCURE_PUBLIC_URL=https://mon-indemnisation.justice.gouv.test/.well-known/mercure
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET:-mercure-dev-cle-secrete-hs256-a-changer-0123456789}
    volumes:
      - .docker/php/fichiers:/app/fichiers
      - ./backend/.env.test:/app/.env.test
      - ./backend/config:/app/config
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/templates:/app/templates
    ports:
      - "8002:80"

  # Vite dev server
  vite:
    hostname: vite
    stdin_open: true
    tty: true
    restart: always
    # En attendant un accès à Harbor
    build:
      context: .
      dockerfile: .docker/vite/Dockerfile
    command: bash -c 'yarn install && yarn dev'
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Dossier à ne pas partager entre guest et host
      - /app/node_modules
    environment:
      VITE_TANSTACK_AFFICHER_DEVTOOLS: ${VITE_TANSTACK_AFFICHER_DEVTOOLS:-}
      VITE_SENTRY_URL: ${VITE_SENTRY_URL:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_TELEPHONE_SERRURIER: ${TELEPHONE_SERRURIER:-}
    ports:
      - "5173:5173"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173" ]
      interval: 6s
      timeout: 5s
      retries: 5

  idconnect:
    image: pierrelemee/mock-oidc-server:2.2.2
    hostname: idconnect
    ports:
      - '9998:9998'
    environment:
      PORT: 9998
      HOST: '0.0.0.0'
      CONFIG: ${IDCONNECT_CONFIG:-/app/data/config.json}
    working_dir: /app
    volumes:
      - ./.docker/idconnect:/app/data/

  # Documenso: fournisseur de signature électronique local (alternative à LegalySpace), interface sur http://localhost:8082
  documenso:
    image: documenso/documenso:v2.20.0
    hostname: documenso
    restart: unless-stopped
    depends_on:
      documenso-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-documenso-dev-nextauth-secret}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-documenso-dev-encryption-key-0123456789}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-documenso-dev-encryption-key-9876543210}
      # URL publique, utilisée dans les liens des courriels de signature
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:8082
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:documenso@documenso-postgres:5432/documenso
      # Documents stockés en base de données plutôt que sur S3
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      # Envoi des emails via Mailpit
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: 1025
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: Documenso
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: documenso@mon-indemnisation.justice.gouv.dev
      # Certificat de scellement des documents signés, auto-signé et généré au premier démarrage
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/certificat/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: documenso
      # Autorise les webhooks vers les conteneurs Symfony, refusés par défaut car résolus en adresses privées
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: symfony,test
    command:
      - sh
      - -c
      - |
        if [ ! -f /opt/documenso/certificat/cert.p12 ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=Documenso dev" -keyout /tmp/cle.pem -out /tmp/cert.pem
          openssl pkcs12 -export -inkey /tmp/cle.pem -in /tmp/cert.pem -out /opt/documenso/certificat/cert.p12 -passout pass:documenso
          rm /tmp/cle.pem /tmp/cert.pem
        fi
        exec sh start.sh
    volumes:
      - ./.docker/documenso/certificat:/opt/documenso/certificat
    ports:
      - "8082:3000"

  documenso-postgres:
    image: postgres:15.8-alpine
    hostname: documenso-postgres
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
    volumes:
      - ./.docker/documenso/postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U documenso -d documenso" ]
      interval: 2s
      timeout: 5s
      retries: 15

  playwright:
    profiles:
      - playwright
    build:
      dockerfile: .docker/playwright/Dockerfile
      context: .
    hostname: playwright
    command: npx playwright test --ui-port=8080 --ui-host=0.0.0.0 --project firefox
    environment:
      APP_BASE_URL: "https://mon-indemnisation.justice.gouv.test"
    volumes:
      - ./end2end/tests:/app/tests
      - ./end2end/playwright.config.ts:/app/playwright.config.ts
    ports:
      - "8080:8080"
      - "3000:3000"

  # Pour permettre de recevoir des webhooks depuis Internet
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - symfony
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    # Renvoie le domaine $NGROK_DOMAIN vers Symfony
    command: http symfony:80 --url=${NGROK_DOMAIN} --log=stdout
    ports:
      # Restreindre l'accès au port à l'hôte uniquement
      - "127.0.0.1:4040:4040"
    profiles:
      - webhooks

volumes:
  symfony_vendor:
  symfony_node_modules:
  puppeteer_cache:
