services:
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-precondev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precontentieux}
      POSTGRES_USER: ${POSTGRES_USER:-precontentieux}
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data:rw
      # Pour relancer ces scripts, vider le dossier de données (`rm -Rf .docker/postgres/data/*`)
      - ./.docker/postgres/scripts/:/docker-entrypoint-initdb.d
      # Accès aux fichiers pour les requêtes nécessitant `pg_stat_file`
      - .docker/php/fichiers:/app/fichiers
    ports:
      - "5432:5432"

  nginx:
    hostname: nginx
    stdin_open: true
    tty: true
    build:
      dockerfile: .docker/nginx/Dockerfile
      context: .
    ports:
      - "80:80"
      - "443:443"

  # Mailpit: email SMTP + web UI to see trapped emails
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # The Symfony app
  symfony:
    hostname: symfony
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: dev
      args:
        - APP_ENV=dev
        - APP_DEBUG=true
    stdin_open: true
    tty: true
    environment:
      - APP_ENV=dev
      - SYMFONY_DEPRECATIONS_HELPER=disabled
      - MAILPIT_URL=http://mailpit:8025
      - SERVER_NAME=:80
      - HTTPS=true;
      - REQUEST_SCHEME=https
      - INSTANCE_NUMBER=0
      - DOSSIER_STOCKAGE_LOCAL=/app/fichiers/dev
    restart: always
    depends_on:
      - postgres
      - mailpit
      - vite
      - idconnect
      - nginx
    volumes:
      # Ce partage, via un volume, est requis afin que Symfony puisse lire les manifestes produits par `encore`
      - ./backend:/app
      - ./frontend/public/preview:/app/public/preview
      - .docker/php/fichiers:/app/fichiers
      - /app/vendor
      - /app/var
      - /app/node_modules
    ports:
      - "8001:80"

  test:
    hostname: test
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: test
      args:
        - APP_ENV=test
        - APP_DEBUG=false
        - APP_SECRET=bafc23a0315b735289c499a886798934
        - DATABASE_URL=postgresql://precontentieux:precontentieux@postgres:5432/precontest?serverVersion=15&charset=utf8
        - BASE_URL=https://mon-indemnisation.justice.gouv.test
    depends_on:
      - postgres
      - mailpit
      - idconnect
      - nginx
      - documenso
    environment:
      - SYMFONY_DEPRECATIONS_HELPER=disabled
      - MAILPIT_URL=http://mailpit:8025
      - HTTPS=true;
      - REQUEST_SCHEME=https
      - INSTANCE_NUMBER=0
      - DOSSIER_STOCKAGE_LOCAL=/app/fichiers/test
      - CC_FRANKENPHP_PORT=80
      - APP_HOME=/app
    volumes:
      - .docker/php/fichiers:/app/fichiers
      - ./backend/.env.test:/app/.env.test
      - ./backend/config:/app/config
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/templates:/app/templates
    ports:
      - "8002:80"

  # Vite dev server
  vite:
    hostname: vite
    stdin_open: true
    tty: true
    restart: always
    # En attendant un accès à Harbor
    build:
      context: .
      dockerfile: .docker/vite/Dockerfile
    command: bash -c 'yarn install && yarn dev'
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Dossier à ne pas partager entre guest et host
      - /app/node_modules
    environment:
      VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:-}
      VITE_TANSTACK_AFFICHER_DEVTOOLS: ${VITE_TANSTACK_AFFICHER_DEVTOOLS:-}
      VITE_SENTRY_URL: ${VITE_SENTRY_URL:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "5173:5173"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173" ]
      interval: 6s
      timeout: 5s
      retries: 5

  idconnect:
    image: pierrelemee/mock-oidc-server:2.2.2
    hostname: idconnect
    ports:
      - '9998:9998'
    environment:
      PORT: 9998
      HOST: '0.0.0.0'
      CONFIG: ${IDCONNECT_CONFIG:-/app/data/config.json}
    working_dir: /app
    volumes:
      - ./.docker/idconnect:/app/data/

  # Documenso: fournisseur de signature électronique local (alternative à Youtrust), interface sur http://localhost:8082
  documenso:
    image: documenso/documenso:v2.20.0
    hostname: documenso
    restart: unless-stopped
    depends_on:
      documenso-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-documenso-dev-nextauth-secret}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-documenso-dev-encryption-key-0123456789}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-documenso-dev-encryption-key-9876543210}
      # URL publique, utilisée dans les liens des courriels de signature
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:8082
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:documenso@documenso-postgres:5432/documenso
      # Documents stockés en base de données plutôt que sur S3
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      # Envoi des emails via Mailpit
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: 1025
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: Documenso
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: documenso@mon-indemnisation.justice.gouv.dev
      # Certificat de scellement des documents signés, auto-signé et généré au premier démarrage
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/certificat/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: documenso
      # Autorise les webhooks vers les conteneurs Symfony, refusés par défaut car résolus en adresses privées
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: symfony,test
    command:
      - sh
      - -c
      - |
        if [ ! -f /opt/documenso/certificat/cert.p12 ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=Documenso dev" -keyout /tmp/cle.pem -out /tmp/cert.pem
          openssl pkcs12 -export -inkey /tmp/cle.pem -in /tmp/cert.pem -out /opt/documenso/certificat/cert.p12 -passout pass:documenso
          rm /tmp/cle.pem /tmp/cert.pem
        fi
        exec sh start.sh
    volumes:
      - ./.docker/documenso/certificat:/opt/documenso/certificat
    ports:
      - "8082:3000"

  documenso-postgres:
    image: postgres:15.8-alpine
    hostname: documenso-postgres
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
    volumes:
      - ./.docker/documenso/postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U documenso -d documenso" ]
      interval: 2s
      timeout: 5s
      retries: 15

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - symfony
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    # Renvoie le domaine $NGROK_DOMAIN vers Symfony
    command: http symfony:80 --url=${NGROK_DOMAIN} --log=stdout
    ports:
      # Restreindre l'accès au port à l'hôte uniquement
      - "127.0.0.1:4040:4040"
    profiles:
      - webhooks

  playwright:
    profiles:
      - playwright
    build:
      dockerfile: .docker/playwright/Dockerfile
      context: .
    hostname: playwright
    command: npx playwright test --ui-port=8080 --ui-host=0.0.0.0 --project firefox
    volumes:
      - ./end2end/tests:/app/tests
    ports:
      - "8080:8080"
      - "3000:3000"
